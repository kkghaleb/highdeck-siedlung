const norm=s=>(s||"").toString().normalize("NFC").replace(/\s+/g," ").trim();
const NIDX={}; for(const k in COORDS){const [st,hn]=k.split("||");NIDX[norm(st).toLowerCase()+"|"+norm(hn).toLowerCase()]=COORDS[k];}
function setStatus(i,t){document.querySelector("#hud .ic").textContent=i;document.getElementById("statustxt").innerHTML=t;}

const PAPER="#E4E9EE", WATER="#CAD7DF", INKLINE="#909BA7", LANDFILL="#DCE2E7", LABEL="#4A5560";
const map=new maplibregl.Map({container:"map",
  style:"https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
  center:[13.4738,52.4632],zoom:15.5,pitch:52,bearing:-18,attributionControl:false});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),"bottom-right");

function retint(){
  for(const l of map.getStyle().layers){ try{
    if(l.type==="background") map.setPaintProperty(l.id,"background-color",PAPER);
    else if(l.type==="fill"){
      if(/water/i.test(l.id)) map.setPaintProperty(l.id,"fill-color",WATER);
      else if(/building/i.test(l.id)) map.setPaintProperty(l.id,"fill-opacity",0);
      else { map.setPaintProperty(l.id,"fill-color",LANDFILL); }
    }
    else if(l.type==="line") map.setPaintProperty(l.id,"line-color",INKLINE);
    else if(l.type==="symbol"){
      if(/poi|natural|water_name|airport|continent/i.test(l.id)){ map.setLayoutProperty(l.id,"visibility","none"); }
      else { map.setPaintProperty(l.id,"text-color",LABEL); try{map.setPaintProperty(l.id,"text-halo-color",PAPER);}catch(e){} }
    }
  }catch(e){} }
}
function buildings3d(){
  let src=null; for(const l of map.getStyle().layers){if(l["source-layer"]==="building"){src=l.source;break;}}
  if(!src) return;
  let before; for(const l of map.getStyle().layers){if(l.type==="symbol"){before=l.id;break;}}
  map.addLayer({id:"hd-buildings",type:"fill-extrusion",source:src,"source-layer":"building",minzoom:14,
    paint:{"fill-extrusion-color":["interpolate",["linear"],["coalesce",["get","render_height"],10],
        0,"#C7D0D8",12,"#BAC4CE",30,"#A9B4BF"],
      "fill-extrusion-height":["coalesce",["get","render_height"],["get","height"],11],
      "fill-extrusion-base":["coalesce",["get","render_min_height"],["get","min_height"],0],
      "fill-extrusion-opacity":.9,"fill-extrusion-vertical-gradient":true}},before);
}

const SIZE=["interpolate",["linear"],["get","sig"],1,7,3,11,6,15,12,21,25,28];
const TEMP=["interpolate",["linear"],["get","sig"],1,"#E9C45E",3,"#EFA84C",6,"#EC8044",9,"#E2553B",14,"#D8402F"];

function rowsToGeoJSON(rows){
  const feats=[];let skipped=[];
  for(const r of rows){
    const street=norm(pick(r,["street","straße","strasse"])), num=norm(pick(r,["house_number","hausnummer","nr","number"]));
    if(!street||!num) continue;
    let lng=parseFloat(pick(r,["lon","lng","longitude","x"])), lat=parseFloat(pick(r,["lat","latitude","y"]));
    if(!(isFinite(lng)&&isFinite(lat))){const c=NIDX[street.toLowerCase()+"|"+num.toLowerCase()];
      if(!c){skipped.push(street+" "+num);continue;} [lng,lat]=c;}
    const sig=parseInt(pick(r,["signatures_count","signatures","unterschriften"])||"0",10)||0;
    feats.push({type:"Feature",geometry:{type:"Point",coordinates:[lng,lat]},
      properties:{label:norm(pick(r,["label"]))||street+" "+num,street,address:norm(pick(r,["address","adresse"])),sig}});
  }
  return {fc:{type:"FeatureCollection",features:feats},skipped,matched:feats.length};
}
function pick(r,names){for(const n of names){for(const k in r){if(k&&k.toLowerCase().trim()===n)return r[k];}}return undefined;}

function addData(){
  map.addSource("sigs",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  map.addLayer({id:"sig-shadow",type:"circle",source:"sigs",filter:[">=",["get","sig"],1],
    paint:{"circle-radius":["+",SIZE,3],"circle-color":"#2A3A48","circle-opacity":.10,"circle-blur":.7}});
  map.addLayer({id:"sig-zero",type:"circle",source:"sigs",filter:["==",["get","sig"],0],
    paint:{"circle-radius":5.5,"circle-color":"rgba(0,0,0,0)","circle-stroke-color":"#7E8B98","circle-stroke-width":1.5,"circle-opacity":1}});
  map.addLayer({id:"sig-fill",type:"circle",source:"sigs",filter:[">=",["get","sig"],1],
    paint:{"circle-radius":SIZE,"circle-color":TEMP,"circle-opacity":.95,
      "circle-stroke-color":"#FBF6EE","circle-stroke-width":1.1}});
  map.addLayer({id:"sig-count",type:"symbol",source:"sigs",filter:[">=",["get","sig"],1],
    layout:{"text-field":["to-string",["get","sig"]],"text-font":["Metropolis Bold","Open Sans Bold"],
      "text-size":["interpolate",["linear"],["get","sig"],1,10,12,14],"text-allow-overlap":true},
    paint:{"text-color":"#20262C","text-halo-color":"rgba(255,255,255,.85)","text-halo-width":1.1}});
  const pop=new maplibregl.Popup({closeButton:false,offset:13,maxWidth:"250px"});
  const hit=["sig-fill","sig-zero"];
  hit.forEach(id=>{
    map.on("mouseenter",id,()=>map.getCanvas().style.cursor="pointer");
    map.on("mouseleave",id,()=>{map.getCanvas().style.cursor="";pop.remove();});
    const show=e=>{const p=e.features[0].properties;pop.setLngLat(e.features[0].geometry.coordinates)
      .setHTML(`<div class="pop-l">${p.label}</div><div class="pop-a">${p.address||p.street}</div><div class="pop-s"><b>${p.sig}</b> Unterschrift${p.sig==1?"":"en"}</div>`).addTo(map);};
    map.on("mousemove",id,show);map.on("click",id,show);
  });
}

let firstLoad=true;
function render(res){
  const {fc,skipped,matched}=res;
  if(matched===0){setStatus("⚠️","0 Häuser erkannt — Spalten/Reihenfolge prüfen.");return;}
  map.getSource("sigs").setData(fc);
  const tot=fc.features.reduce((s,f)=>s+f.properties.sig,0);
  const withSig=fc.features.filter(f=>f.properties.sig>0).length, zeros=fc.features.length-withSig;
  document.getElementById("tot").textContent=tot;
  document.getElementById("sub").innerHTML=`<b>${withSig}</b> von <b>${fc.features.length}</b> Häusern mit Unterschriften<br><span class="z">${zeros} Häuser bei 0 — Besuch nötig</span>`;
  setStatus("✓",`live · ${matched} Häuser${skipped.length?` · ${skipped.length} ohne Koordinaten`:""} · ${new Date().toLocaleTimeString("de-DE")}`);
  if(skipped.length) console.warn("Ohne Koordinaten (Adresse nicht im Datensatz):",skipped);
  if(firstLoad){const b=new maplibregl.LngLatBounds();fc.features.forEach(f=>b.extend(f.geometry.coordinates));
    try{map.fitBounds(b,{padding:{top:90,bottom:80,left:330,right:70},pitch:52,bearing:-18,maxZoom:16.6,duration:0});}catch(e){}
    firstLoad=false;}
}
function refresh(){
  setStatus("⏳","Lädt Daten …");
  const cb="gviz_"+Date.now(), s=document.createElement("script");
  window[cb]=function(resp){
    try{
      const t=resp.table, cols=(t.cols||[]).map(c=>(c.label||"").toString().trim());
      const byName=(t.rows||[]).map(r=>{const o={};(r.c||[]).forEach((cell,i)=>{o[cols[i]||("col"+i)]=cell?cell.v:null;});return o;});
      const order=["Label","street","house_number","address","signatures_count"];
      const byPos=(t.rows||[]).map(r=>{const o={};order.forEach((k,i)=>{o[k]=(r.c&&r.c[i])?r.c[i].v:null;});return o;});
      const a=rowsToGeoJSON(byName), b=rowsToGeoJSON(byPos);
      render(b.matched>a.matched?b:a);
    }catch(e){setStatus("⚠️","Parsefehler: "+e.message);}
    delete window[cb]; s.remove();
  };
  s.onerror=function(){setStatus("⚠️","Daten nicht erreichbar. Sheet auf „Jeder mit Link · Betrachter“ stellen und die Datei direkt im Browser öffnen.");delete window[cb];s.remove();};
  s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&headers=1&tqx=out:json;responseHandler:${cb}&_=`+Date.now();
  document.body.appendChild(s);
}
map.on("error",()=>{ if(document.getElementById("tot").textContent==="–") setStatus("⚠️","Karte konnte nicht laden — Internetverbindung?"); });
map.on("load",()=>{ try{retint();}catch(e){} try{buildings3d();}catch(e){} addData(); refresh(); setInterval(refresh,REFRESH_MS); });
document.getElementById("refresh").onclick=refresh;
</script>
